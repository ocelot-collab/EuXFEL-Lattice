# Conversion config for going from Component List to OCELOT.

# This will be looked for inside of src/euxfel/longlists
component_list: component_list_2026.02.13.xls


writer:
  # NAME2 is stored as `ps_id` on every element, not just the magnets, and
  # regenerating the component list needs all of them.  Omitting this key writes
  # it for every element type; list types explicitly to narrow it.
  write_types_power_supplies: null

rows:
  skip:
    TYPE: ["CUX" # Actually not sure what these are, but they're almost entirely inside other elements
                 # except for one single element so for simplicity we just drop them all.
                 # Also they're converted to HCor which will mess with Sergey's orbit correction gui.
                 # So another reason to drop them all for now.
           ]
    CLASS: []
    GROUP: []
    NAME1: ["CTBI.26.I1" # We omit this in order to make room for the ocelot_start marker @ 3.2m.
            ]

  keep:
    NAME1: []

  edit:
    TYPE:
      CAX: { LENGTH: 0.0 }
      CAY: { LENGTH: 0.0 }
      CBX: { LENGTH: 0.0 }
      CBY: { LENGTH: 0.0 }
    CLASS: {}
    GROUP: {}

targets: # Each subsequence corresponds to the name of a section below (case insensitive)
  g1d: ["g1", "g1d"]
  i1d: ["i1", "i1d"]
  b1d: ["i1", "l1", "b1d"]
  b2d: ["i1", "l1", "l2", "b2d"]
  tld: ["i1", "l1", "l2", "l3", "cl", "tl2tld"]
  t4d: ["i1", "l1", "l2", "l3", "cl", "tl2", "tl34", "sase1", "t4", "sase3", "t4d"]
  t5d: ["i1", "l1", "l2", "l3", "cl", "tl2", "tl34_sa2", "t1", "sase2", "t3", "t5", "t5d"]

sections:
  I1:
    sheet: I1toI1D
    start_marker_name1: STSEC.23.I1
    stop_marker_name1: ENSUB.62.I1
    extras:
      TDSA.52.I1:
        tilt: 1.570796327
      U74.49.I1:
        Kx: 1.294
        Ky: 0
    new_markers:
      astra_stop: { delta_s: 3.2 }
      ocelot_start: { delta_s: 3.2 }
      a1_sim_stop: { reference: C.A1.1.8.I1, adjacent: after }
      ah1_sim_start: { reference: C.A1.1.8.I1, adjacent: after }
      a1_1_stop: { reference: C.A1.1.1.I1, adjacent: after }
      lh_start: { reference: U74.49.I1, adjacent: before }
      lh_stop: { reference: U74.49.I1, adjacent: after }
      i1_tds_start: { reference: TDSA.52.I1, adjacent: before }
      i1_tds_stop: { reference: TDSA.52.I1, adjacent: after }
      DUMP.CSR.START: { delta_s: 38.789005 }
    matching:
      marker: MATCH.52.I1
      quadrupoles:
        - Q.37.I1
        - Q.38.I1
        - QI.46.I1
        - QI.47.I1
        - QI.50.I1

  I1D:
    sheet: I1toI1D
    start_marker_name1: STSEC.62.I1D
    stop_marker_name1: ENSEC.66.I1D

  # The G1D diagnostic dump branches off inside section I1, at subsection
  # boundary ENSUB.24.I1 (s = 1.398782) -- long before I1 ends.  So the gun is
  # split out into its own module here rather than reusing the head of `i1`,
  # which continues past the branch into the I1D line.
  #
  # G1 therefore duplicates the first 17 rows of `i1`.  That mirrors the source:
  # every I1toXXX sheet repeats the injector in full.  Splitting `i1` itself
  # would be the alternative, but it would re-point CATHODE_TWISS0 and every
  # other target's subsequence list for no benefit to them.
  G1:
    sheet: I1toG1D
    start_marker_name1: STSEC.23.I1
    stop_marker_name1: ENSUB.24.I1

  G1D:
    sheet: I1toG1D
    start_marker_name1: STSUB.24II.I1
    stop_marker_name1: ENSUB.25.I1

  L1:
    sheet: I1toB1D
    start_marker_name1: STSUB.62.I1
    stop_marker_name1: ENSUB.229.B1
    new_markers:
      dogleg_start: { reference: CIX.65.I1, adjacent: before }
      dogleg_stop_bc0_start: { reference: STLAT.96.I1, adjacent: before }
      bc0_stop_l1_start: { reference: QI.103.I1, adjacent: before }
      l1_stop_bc1_start: { reference: STLAT.182.B1, adjacent: before }
      bc1_stop_l2_start: { reference: TORA.203.B1, adjacent: after }

  B1D:
    sheet: I1toB1D
    start_marker_name1: STSEC.229.B1D
    stop_marker_name1: ENSEC.237.B1D

  L2:
    sheet: I1toB2D
    start_marker_name1: STSUB.229.B1
    stop_marker_name1: ENSUB.466.B2
    new_markers:
      l2_stop_bc2_start: { reference: STLAT.393.B2, adjacent: before }
      bc2_stop_b2d_start: { reference: TORA.415.B2, adjacent: after }

  B2D:
    sheet: I1toB2D
    start_marker_name1: STSEC.466.B2D
    stop_marker_name1: ENSEC.480.B2D

  L3:
    sheet: I1toTLD
    start_marker_name1: STSUB.466.B2
    stop_marker_name1: ENSEC.1652.L3
    new_markers:
      stop_l3: { reference: CFY.1651.L3, adjacent: before }

  CL:
    sheet: I1toTLD
    start_marker_name1: STSEC.1652.CL
    stop_marker_name1: ENSEC.1854.CL

  TL2TLD:
    sheet: I1toTLD
    start_marker_name1: STSEC.1854.TL
    stop_marker_name1: ENSEC.2130.TLD
    extras:
      QF.1952.TL: { k1: 0.17919084758504 }
      QF.1967.TL: { k1: -0.17919084758504 }
    new_elements:
      QK.1982.TL:
        position: { reference: MBZ.1980d.TLD, delta_s: 0.4724 }
        type: SlicedElement
        expression: "(19 * [xslice1982] + [yslice1982]) * 10"
        elements:
          xslice1982:
            type: RBend
            l: 0.005276
            angle: 1.180477777265855e-05
            k1: 0.090359600075815
          yslice1982:
            type: RBend
            l: 0.005276
            angle: -7.780804909999998e-05
            k1: -0.090359600075815
            tilt: 1.570796327

  TL2:
    sheet: I1toT5D
    start_marker_name1: STSEC.1854.TL
    stop_marker_name1: ENSUB.1980.TL

  TL34_SA2:
    sheet: I1toT5D
    start_marker_name1: STSUB.1980.TL
    stop_marker_name1: ENSUB.2025.TL
    extras:
      QF.2012.TL: { k1: -0.1791908476 }

  T1:
    sheet: I1toT5D
    start_marker_name1: STSEC.2025.T1
    stop_marker_name1: ENSEC.2197.T1
    new_elements:
      QK.2027.TL:
        position: { reference: MBZ.2025d.T1, delta_s: 0.472401 }
        type: SlicedElement
        expression: "(19 * [yslice2027] + [xslice2027]) * 10"
        elements:
          xslice2027:
            type: RBend
            l: 0.005276
            angle: -7.791933105545399e-05
            k1: -0.090359600075815
          yslice2027:
            type: RBend
            l: 0.005276
            angle: 1.181521439452105e-05
            k1: 0.090359600075815
            tilt: 1.570796327

      # MAD-8's RotSystemTD1, at the head of T1M and so immediately before the
      # first untilted septum BZ.2030.T1.  Defined in Run_South_2025.txm:299-322
      # and used only by the survey line I1TT5D_sur, never by the Twiss line, so
      # it patches the design geometry onto the as-built XTD1 tunnel without
      # touching the optics.  makelist_release.m:56 discards every row whose name
      # begins ROT, which is why these are absent from the component list.
      #
      # az1 + az2 = +9.769e-06 is a deliberate residual roll: without it the
      # SASE2 branch is rolled by 9.769 urad and the T5D dump lands 2.3 mm out.
      # Order matters -- roll, pitch, roll back.
      ROT.Z1.T1:
        position: { reference: MBZ.2030a.T1, adjacent: before }
        type: SRot
        angle: -0.00440392786446921
      ROT.Y.T1:
        position: { reference: MBZ.2030a.T1, adjacent: before }
        type: YRot
        angle: 9.27121409529346e-08
      ROT.Z2.T1:
        position: { reference: MBZ.2030a.T1, adjacent: before }
        type: SRot
        angle: 0.00441369699554469

  SASE2:
    sheet: I1toT5D
    start_marker_name1: STSEC.2197.SA2
    stop_marker_name1: ENSEC.2473.SA2
    new_elements:
      # Run_South_2025.txm:318, at the SA2 entrance ("Sa2_Ursprung"), survey
      # line only.  Same story as RotSystemTD1 above.
      ROT.Y.SA2:
        position: { reference: STSEC.2197.SA2, adjacent: after }
        type: YRot
        angle: -2.365095999996847e-06

  T3:
    sheet: I1toT5D
    start_marker_name1: STSEC.2473.T3
    stop_marker_name1: ENSEC.2743.UN1
    new_markers:
      t3_csr_start: { reference: QH.2544.T3, adjacent: after }
      t3_csr_stop: { reference: QH.2569.T3, adjacent: before }

  T5:
    sheet: I1toT5D
    start_marker_name1: STSEC.2743.T5
    stop_marker_name1: ENSEC.3039.UN2

  T5D:
    sheet: I1toT5D
    start_marker_name1: STSEC.3039.T5D
    stop_marker_name1: ENSEC.3189.T5D

  TL34:
    sheet: I1toT4D
    start_marker_name1: STSUB.1980.TL
    stop_marker_name1: ENSUB.2025.TL

  SASE1:
    sheet: I1toT4D
    start_marker_name1: STSUB.2025.TL
    stop_marker_name1: ENSEC.2461.SA1

  T4:
    sheet: I1toT4D
    start_marker_name1: STSEC.2461.T4
    stop_marker_name1: ENSEC.2800.T4
    new_markers:
      t4_csr_start: { reference: QH.2582.T4, adjacent: after }
      t4_csr_stop: { reference: BPMA.2606.T4, adjacent: after }

  SASE3:
    sheet: I1toT4D
    start_marker_name1: STSEC.2800.SA3
    stop_marker_name1: ENSEC.2955.SA3

  T4D:
    sheet: I1toT4D
    start_marker_name1: STSEC.2955.T4D
    stop_marker_name1: ENSEC.3106.T4D
