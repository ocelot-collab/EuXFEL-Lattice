# How the "real" model differs from the design model.
#
# The design model is MAD-8, converted and nothing more: `euxfel convert-mad8`
# reproduces the tapes to 3e-6 m in geometry and ~1e-4 in beta, and that is the
# whole of its job.  It is what the component list is generated from, and what
# tests/test_mad8_optics.py holds to MAD-8.
#
# This file describes the second stage -- `euxfel convert-real` -- which turns
# that into a model of the machine as it actually runs.  Everything here is a
# deliberate divergence from MAD-8, not a correction to the conversion:
#
#   new_markers   points s2e sections are sliced at.  MAD-8 has no reason to
#                 carry `ocelot_start` or `lh_start`; we do.  Geometry-neutral.
#   extras        attributes MAD-8 cannot express -- the laser-heater undulator's
#                 Kx, the rotated TDS.  These change the optics on purpose.
#   matching      quadrupole strengths re-matched at a marker, with the corrected
#                 twiss0 written out.  This is where we assert our model is more
#                 realistic than MAD-8's rather than merely different.
#   new_elements  elements absent from MAD-8 entirely, e.g. the XY quadrupoles.
#
# Keyed by section, matching the module names `convert-mad8` writes.
#
# Moved here from longlists/conversion-config.yaml, which drives the component
# list route.  These blocks never belonged to that pathway: they are properties
# of our model, and both pathways would otherwise have to declare them twice.

